[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "non-steam-game-updater"
version = "1.0.0"
description = "Steam Non-Steam Game Shortcut Updater"
readme = "README.md"
package-mode = true
packages = [{include = "non_steam_game_updater", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
python-dotenv = "1.2.4"
textual = "8.2.8"
vdf = "3.4"

[tool.poetry.group.dev.dependencies]
pytest = "8.4.2"
pytest-asyncio = "1.4.1"
ruff = "0.16.3"

[tool.poetry.scripts]
non-steam-game-updater = "non_steam_game_updater.cli:main"
non-steam-game-updater-tui = "non_steam_game_updater.tui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
exclude = ["env", ".venv", "build", "dist", ".github"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PERF"]
ignore = ["B904", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["non_steam_game_updater"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 120

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src"]
